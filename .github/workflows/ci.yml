name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests (includes the database tests on a real Postgres engine)
        run: npm test
      - name: Build
        run: npm run build
      - name: Production dependencies have no known high-severity issues
        run: npm audit --omit=dev --audit-level=high
